  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }

    /* Animations */
    @keyframes bubbleRise {
      0% { transform: translateY(105vh) translateX(0) scale(0.6); opacity: 0; }
      20% { opacity: 0.6; }
      50% { transform: translateY(50vh) translateX(25px) scale(1); opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(-20px) scale(1.1); opacity: 0; }
    }
    @keyframes causticsWave {
      0%, 100% { opacity: 0.25; transform: scale(1) translateY(0) rotate(0deg); }
      50% { opacity: 0.55; transform: scale(1.08) translateY(-15px) rotate(2deg); }
    }
    @keyframes pulseHeartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.22); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }
    @keyframes timerTick {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.05); }
    }
    @keyframes progressShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @keyframes comboGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(245,199,94,0.3), inset 0 0 6px rgba(245,199,94,0.2); }
      50% { box-shadow: 0 0 22px rgba(245,199,94,0.7), inset 0 0 12px rgba(245,199,94,0.4); }
    }
    @keyframes cardShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-6px) rotate(-2deg); }
      40% { transform: translateX(6px) rotate(2deg); }
      60% { transform: translateX(-4px) rotate(-1deg); }
      80% { transform: translateX(4px) rotate(1deg); }
    }
    @keyframes matchFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes floatScore {
      0% { opacity: 1; transform: translateY(0) scale(0.9); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }

    .animate-caustics { animation: causticsWave 9s ease-in-out infinite alternate; }
    .animate-heartbeat { animation: pulseHeartbeat 1.8s ease-in-out infinite; }
    .animate-timer-tick { animation: timerTick 1s ease-in-out infinite; }
    .animate-combo-glow { animation: comboGlow 2.2s infinite ease-in-out; }
    .animate-progress-shine { animation: progressShine 2.5s infinite linear; }
    .card-shake-anim { animation: cardShake 0.45s ease-in-out; }
    .matched-float-card { animation: matchFloat 4s ease-in-out infinite; }

    /* 3D Flip Card Container */
    .card-3d-wrap {
      perspective: 1000px;
    }
    .card-3d-inner {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }
    .card-3d-front, .card-3d-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-3d-front {
      transform: rotateY(180deg);
    }
    .card-3d-flipped {
      transform: rotateY(180deg);
    }
  </style>

    // ==========================================
    // SCREEN 4: Interactive Ocean Matrix Playfield
    // ==========================================
    function PlayfieldScreen({ config, onOpenPause, onTriggerVictory, onTriggerDefeat }) {
      const navigate = useNavigate();

      // Setup cards deck based on current config
      const [cards, setCards] = useState([]);
      const [flippedIndexes, setFlippedIndexes] = useState([]);
      const [matchedPairIds, setMatchedPairIds] = useState([]);
      const [lives, setLives] = useState(config.mistakes);
      const [elapsedSeconds, setElapsedSeconds] = useState(88); // 01:28 as design prototype
      const [sonarCount, setSonarCount] = useState(1);
      const [toast, setToast] = useState(null);
      const [scorePopups, setScorePopups] = useState([]);
      const [shakingCards, setShakingCards] = useState([]);

      const totalPairs = config.pairs;
      const isEvaluatingRef = useRef(false);

      // Generate grid deck with 11 pairs pre-matched to match Screen 4's exact prototype state (11/12 completed)
      useEffect(() => {
        const availableItems = MARINE_CATALOG.slice(0, totalPairs);
        let deck = [];
        availableItems.forEach((item) => {
          deck.push({ ...item, key: `${item.id}-a` });
          deck.push({ ...item, key: `${item.id}-b` });
        });

        // If default 24 cards (12 pairs), pre-match 11 pairs and leave Seahorse for interactive finale
        if (totalPairs === 12) {
          const preMatched = availableItems.filter(i => i.id !== 'seahorse').map(i => i.id);
          setMatchedPairIds(preMatched);
        } else {
          setMatchedPairIds([]);
        }

        setCards(deck);
        setLives(config.mistakes);
      }, [config]);

      // Timer effect
      useEffect(() => {
        const timer = setInterval(() => {
          setElapsedSeconds((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const triggerToast = (text) => {
        setToast(text);
        setTimeout(() => setToast(null), 2400);
      };

      const spawnPopup = (text) => {
        const id = Date.now() + Math.random();
        setScorePopups((prev) => [...prev, { id, text }]);
        setTimeout(() => {
          setScorePopups((prev) => prev.filter(p => p.id !== id));
        }, 1200);
      };

      // Card Flip Handler
      const handleCardClick = (index) => {
        if (isEvaluatingRef.current) return;
        if (flippedIndexes.includes(index)) return;
        const card = cards[index];
        if (matchedPairIds.includes(card.id)) return;

        spawnPopup('+800 PTS');

        const newFlipped = [...flippedIndexes, index];
        setFlippedIndexes(newFlipped);

        if (newFlipped.length === 2) {
          isEvaluatingRef.current = true;
          const [firstIdx, secondIdx] = newFlipped;
          const card1 = cards[firstIdx];
          const card2 = cards[secondIdx];

          if (card1.id === card2.id) {
            // MATCH SUCCESS!
            setTimeout(() => {
              const updatedMatched = [...matchedPairIds, card1.id];
              setMatchedPairIds(updatedMatched);
              setFlippedIndexes([]);
              isEvaluatingRef.current = false;

              spawnPopup('🎉 完美配对 x2.0!');
              triggerToast('🎉 配对成功！已集齐微保九周年全部海洋守护！');

              if (updatedMatched.length >= totalPairs) {
                setTimeout(() => {
                  navigate('/mission-complete');
                }, 900);
              }
            }, 600);
          } else {
            // MISTAKE
            setTimeout(() => {
              const nextLives = lives - 1;
              setLives(nextLives);
              setShakingCards([firstIdx, secondIdx]);
              triggerToast('⚠️ 选错了！扣除1次心率容错机会');

              setTimeout(() => {
                setShakingCards([]);
                setFlippedIndexes([]);
                isEvaluatingRef.current = false;
                if (nextLives <= 0) {
                  navigate('/mission-failed');
                }
              }, 600);
            }, 500);
          }
        }
      };

      const simulateMistake = () => {
        const next = lives - 1;
        setLives(Math.max(0, next));
        triggerToast('⚠️ 选错了！扣除1次心率容错机会');
        if (next <= 0) {
          setTimeout(() => navigate('/mission-failed'), 600);
        }
      };

      const restartGame = () => {
        setLives(config.mistakes);
        setElapsedSeconds(0);
        setFlippedIndexes([]);
        if (totalPairs === 12) {
          const preMatched = MARINE_CATALOG.slice(0, 11).map(i => i.id);
          setMatchedPairIds(preMatched);
        } else {
          setMatchedPairIds([]);
        }
        triggerToast('游戏已重置，祝您顺利通关微保九周年！');
      };

      const triggerSonarHint = () => {
        if (sonarCount > 0) {
          setSonarCount(sonarCount - 1);
          triggerToast('🔍 声呐透视已激活：最后两张牌就是【金福海马】！');
        } else {
          triggerToast('声呐透视次数已用尽！');
        }
      };

      const matchedCount = matchedPairIds.length;
      const progressPercent = Math.min(100, Math.round((matchedCount / totalPairs) * 100));

      return (
        <main className="relative z-10 w-full pt-20 min-h-[calc(100vh-64px)] flex flex-col justify-between">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-surface-container-highest/95 border border-primary/50 text-primary text-sm font-label-md shadow-2xl backdrop-blur-md pointer-events-none flex items-center gap-2 animate-bounce">
              <span className="material-symbols-outlined text-[18px]">verified</span>
              <span>{toast}</span>
            </div>
          )}

          {/* Floating score sparkle popups */}
          {scorePopups.map((p) => (
            <div
              key={p.id}
              className="fixed font-label-score font-bold text-tertiary drop-shadow-[0_0_10px_rgba(245,199,94,0.8)] text-lg pointer-events-none z-50"
              style={{ left: '50%', top: '48%', transform: 'translate(-50%, -50%)', animation: 'floatScore 1.2s forwards cubic-bezier(0.2, 0.8, 0.2, 1)' }}
            >
              {p.text}
            </div>
          ))}

          <div className="flex flex-col w-full">
            <div className="relative w-full px-gutter py-space-xs flex flex-col gap-space-sm max-w-[1720px] mx-auto overflow-hidden">
              
              {/* Playfield HUD Bar */}
              <section className="w-full bg-surface-container-high/85 backdrop-blur-xl rounded-xl px-space-md py-space-sm shadow-[0_12px_32px_rgba(0,15,30,0.6)] border border-surface-variant/30 flex flex-wrap items-center justify-between gap-space-sm">
                <div className="flex items-center gap-space-md flex-wrap">
                  {/* Combo Badge */}
                  <div className="relative flex items-center gap-2 bg-surface-container-lowest/70 px-3 py-1.5 rounded-lg border border-tertiary/40 animate-combo-glow transition-all">
                    <span className="material-symbols-outlined text-tertiary text-[20px] animate-bounce">bolt</span>
                    <span className="font-label-md text-tertiary font-bold tracking-wide">连击增益: 4x COMBO! (得分 x1.5)</span>
                    <div className="absolute -top-3 right-2 text-[11px] font-bold text-tertiary font-label-score animate-pulse pointer-events-none">+1,200</div>
                  </div>

                  <div className="flex items-center gap-2 bg-surface-container-lowest/70 px-3 py-1.5 rounded-lg border border-surface-variant/30 transition-all hover:border-secondary/40">
                    <span className="material-symbols-outlined text-secondary text-[20px] animate-pulse">security</span>
                    <span className="font-body-sm text-on-surface-variant">
                      深海守护任务：还差 <strong className="text-primary font-bold text-[16px] drop-shadow-[0_0_8px_rgba(100,226,199,0.8)]">{totalPairs - matchedCount}</strong> 对卡牌达成全域保障！
                    </span>
                  </div>
                </div>

                {/* Progress Bar & Telemetry */}
                <div className="flex items-center gap-space-sm flex-1 min-w-[280px] max-w-[500px]">
                  <div className="w-full flex flex-col gap-1">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-on-surface-variant font-label-sm">探险探索进度</span>
                      <span className="text-primary font-bold font-label-score text-sm">{matchedCount}/{totalPairs} 完成</span>
                    </div>
                    <div className="w-full h-3 bg-surface-container-lowest rounded-full overflow-hidden p-0.5 border border-surface-variant/30 relative shadow-inner">
                      <div 
                        className="h-full bg-gradient-to-r from-primary-container via-primary to-primary-fixed rounded-full shadow-[0_0_12px_rgba(100,226,199,0.7)] transition-all duration-500 relative overflow-hidden"
                        style={{ width: `${progressPercent}%` }}
                      >
                        <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/50 to-transparent animate-progress-shine"></div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Actions & Heart Rate HUD */}
                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1.5 bg-surface-container-lowest/80 px-2.5 py-1 rounded-lg border border-surface-variant/40 shadow-inner">
                    <div className="flex items-center gap-0.5 text-secondary animate-heartbeat">
                      {Array.from({ length: config.mistakes }).map((_, i) => (
                        <span 
                          key={i} 
                          className={`material-symbols-outlined text-[18px] sm:text-[20px] transition-transform hover:scale-125 ${i < lives ? 'text-secondary' : 'text-outline-variant/60'}`}

                    <span className="font-label-sm text-secondary font-bold ml-1">{lives}/{config.mistakes}</span>

                  >
                    <span className="material-symbols-outlined text-primary text-[18px]">radar</span>
                    <span>声呐透视 ({sonarCount})</span>
                  </button>

                  <button
                    onClick={onOpenPause}

                    <span className="material-symbols-outlined text-primary text-[18px]">pause_circle</span>
                    <span className="hidden sm:inline">暂停</span>
                  </button>

                  <button

                    <span className="hidden sm:inline">重开</span>

              <div className="relative w-full flex flex-col items-center">

                  {cards.map((card, index) => {
                    const isMatched = matchedPairIds.includes(card.id);
                    const isFlipped = flippedIndexes.includes(index);
                    const isShaking = shakingCards.includes(index);

                    if (isMatched) {
                      // Already Matched Card (Screens 4 standard)

                      <span>连击加成 +4,200</span>
                      <span>总计 12,850 PTS</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Ocean Creature Compendium */}
      

              {/* Settlement Actions */}
              <div className="relative z-10 max-w-4xl mx-auto mt-space-xl flex flex-col sm:flex-row items-center justify-center gap-space-md w-full pb-space-lg">
                <button
                  onClick={() => navigate('/ocean-matrix-playfield')}
                  className="w-full sm:w-auto px-space-xl py-4 rounded-xl bg-gradient-to-r from-tertiary to-primary text-on-primary-fixed font-headline-sm text-headline-sm tracking-wide shadow-[0_8px_0_#005144,0_16px_28px_rgba(100,226,199,0.35)] hover:shadow-[0_4px_0_#005144,0_10px_20px_rgba(100,226,199,0.25)] hover:translate-y-1 active:translate-y-2 active:shadow-none transition-all flex items-center justify-center gap-space-sm group cursor-pointer"
                  type="button"
                >
                  <span className="material-symbols-outlined text-[30px] group-hover:rotate-180 transition-transform duration-500">replay</span>
                  <span>再玩一局</span>
                </button>

                <button
                  onClick={() => alert('🏆 腾讯微保 9周年海底排行榜：恭喜您当前位列好友榜 TOP 1！')}
                  className="w-full sm:w-auto px-space-lg py-4 rounded-xl bg-surface-container-high text-on-surface font-headline-sm text-headline-sm tracking-wide shadow-[0_6px_0_#000f1e] hover:shadow-[0_2px_0_#000f1e] hover:translate-y-1 active:translate-y-1.5 active:shadow-none transition-all flex items-center justify-center gap-space-sm hover:text-primary cursor-pointer"
                  type="button"
                >
                  <span className="material-symbols-outlined text-[26px] text-tertiary">leaderboard</span>
                  <span>查看排行榜</span>
                </button>

                <button
                  onClick={() => navigate('/')}
                  className="w-full sm:w-auto px-space-lg py-4 rounded-xl bg-surface-container-low text-on-surface-variant font-headline-sm text-headline-sm tracking-wide shadow-[0_6px_0_#000f1e] hover:shadow-[0_2px_0_#000f1e] hover:translate-y-1 active:translate-y-1.5 active:shadow-none transition-all flex items-center justify-center gap-space-sm hover:text-on-surface cursor-pointer"
                  type="button"
                >
                  <span className="material-symbols-outlined text-[26px]">home</span>
                  <span>返回主菜单</span>
                </button>
              </div>
            </div>
          </div>
        </main>
      );
    }

    // Rules Modal Shared Component
    function RulesModal({ isOpen, onClose }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-surface-container-lowest/85 backdrop-blur-lg p-4">
          <div className="relative w-full max-w-xl bg-surface-container-high rounded-2xl p-6 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.8),inset_0_0_20px_rgba(67,198,172,0.2)] flex flex-col gap-6" style={{ outline: '2px solid #43c6ac' }}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
                  <span className="material-symbols-outlined text-[24px]">menu_book</span>
                </div>
                <div>
                  <h2 className="font-headline-md text-headline-md text-on-surface">探险潜水守则</h2>
                  <p className="font-label-sm text-label-sm text-primary uppercase tracking-wider">Dive Manual & Match Guide</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-bright transition-colors cursor-pointer"
                type="button"
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="flex flex-col gap-3.5">
              <div className="flex items-start gap-4 p-3.5 rounded-xl bg-surface-container-lowest/70">
                <div className="w-8 h-8 rounded-full bg-primary text-on-primary font-bold flex items-center justify-center shrink-0">1</div>
                <div>
                  <span className="font-headline-sm text-[16px] text-on-surface font-semibold">每次翻开两张牌</span>
                  <p className="font-body-md text-body-md text-on-surface-variant mt-0.5">点击任意两张沉于海底的卡牌翻转展示，记忆其对应图案与坐标位置。</p>
                </div>
              </div>
              <div className="flex items-start gap-4 p-3.5 rounded-xl bg-surface-container-lowest/70">
                <div className="w-8 h-8 rounded-full bg-tertiary text-on-tertiary font-bold flex items-center justify-center shrink-0">2</div>
                <div>
                  <span className="font-headline-sm text-[16px] text-on-surface font-semibold">匹配相同生物即可消除</span>
                  <p className="font-body-md text-body-md text-on-surface-variant mt-0.5">若两张图案一致（如小丑鱼或发光水母），宝藏成功打捞并积蓄探险积分与连击！</p>
                </div>
              </div>
              <div className="flex items-start gap-4 p-3.5 rounded-xl bg-surface-container-lowest/70">
                <div className="w-8 h-8 rounded-full bg-error text-on-error font-bold flex items-center justify-center shrink-0">3</div>
                <div>
                  <span className="font-headline-sm text-[16px] text-on-surface font-semibold">翻错消耗机会，机会归零失败</span>
                  <p className="font-body-md text-body-md text-on-surface-variant mt-0.5">两张图案不符将重新盖上，并扣除1次容错机会。氧气耗尽潜水员将紧急上浮！</p>
                </div>
              </div>
            </div>

            <button
              onClick={onClose}
              className="w-full py-3 rounded-xl bg-primary text-on-primary font-headline-sm text-[16px] font-bold shadow-[0_4px_0_#004e42] active:translate-y-1 active:shadow-none transition-all cursor-pointer"
              type="button"
            >
              我已掌握，准备下潜！ (READY)
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // TOP LEVEL APP COMPONENT
    // ==========================================
    function App() {
      const [musicOn, setMusicOn] = useState(true);
      const [sfxOn, setSfxOn] = useState(true);
      const [isRulesModalOpen, setIsRulesModalOpen] = useState(false);
      const [isPauseOpen, setIsPauseOpen] = useState(false);

      // Global game configuration state (persisted across screens)
      const [config, setConfig] = useState({
        tiles: 24,
        cols: 6,
        rows: 4,
        pairs: 12,
        time: 3.0,
        mistakes: 5
      });

      // Escape key listener to toggle pause
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsPauseOpen((prev) => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      return (
        <div className="min-h-screen flex flex-col justify-between selection:bg-primary selection:text-on-primary">
          <OceanBackground />
          <Header
            musicOn={musicOn}
            setMusicOn={setMusicOn}
            sfxOn={sfxOn}
            setSfxOn={setSfxOn}
            onOpenRules={() => setIsRulesModalOpen(true)}
          />

          <Routes>
            <Route
              path="/"
              element={
                <SetupScreen
                  config={config}
                  setConfig={setConfig}
                  onOpenRules={() => setIsRulesModalOpen(true)}
                />
              }
            />
            <Route
              path="/ocean-matrix-playfield"
              element={
                <PlayfieldScreen
                  config={config}
                  onOpenPause={() => setIsPauseOpen(true)}
                  onTriggerVictory={() => {}}
                  onTriggerDefeat={() => {}}
                />
              }
            />
            <Route path="/mission-failed" element={<DefeatScreen />} />
            <Route path="/mission-complete" element={<VictoryScreen />} />
          </Routes>

          {/* Pause Modal (Screen 2) */}
          {isPauseOpen && (
            <PauseScreen
              onClose={() => setIsPauseOpen(false)}
              onRestart={() => setIsPauseOpen(false)}
            />
          )}

          {/* Rules Modal (Screen 1 Modal) */}
          <RulesModal
            isOpen={isRulesModalOpen}
            onClose={() => setIsRulesModalOpen(false)}
          />

          <Footer />
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(
      <MemoryRouter initialEntries={['/']}>
        <App />
      </MemoryRouter>
    );
  </script>
</body>
</html>
